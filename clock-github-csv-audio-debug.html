<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Class</title>
  <style>

    * {
      font-family: Arial, Helvetica, sans-serif !important;
    }

    html, body { margin: 0; width: 100%; min-height: 100%; }
    body { min-height: 100vh; position: relative; }

    #dataTable {
      position: absolute;
      top: 10px;
      right: 10px;
      width: calc(60vw - 15px);
      max-width: calc(60vw - 15px);
      height: calc(50vh - 20px);
      display: table;
      border-collapse: collapse;
    }

    table, th, td { border: 1px solid black; }
    th, td { white-space: pre-line; padding: 8px; text-align: left; }
    /* show \n as line breaks in cells */
    td, th { white-space: pre-line; }
    .bold-col { font-weight: 700 !important; }
  
    #clockPanel {
      position: absolute;
      top: 10px;
      left: 10px;
      width: calc(40vw - 15px);
      height: calc(50vh - 20px);
      overflow: auto;
      box-sizing: border-box;
      padding: 6px 18px 18px;
      background: var(--page-color, #101427);
      color: #f7f8ff;
      font-family: Arial, Helvetica, system-ui, sans-serif;
      text-align: center;
    }

    #clockPanel .clock-label {
      color: var(--header-color, #a8bdf7);
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: clamp(.8rem, 1.3vw, 1.2rem);
      font-weight: 750;
    }

    #clock {
      margin-top: 0;
      font-variant-numeric: tabular-nums;
      font-size: clamp(3rem, 6vw, 6rem);
      line-height: 1;
      font-weight: 800;
      white-space: nowrap;
    }

    #date {
      margin-top: 4px;
      color: #d8def3;
      font-size: clamp(1rem, 1.6vw, 1.5rem);
    }

    #countdownBox {
      margin-top: 8px;
      padding: 16px;
      background: var(--panel-color, #1d2540);
      border: 1px solid var(--header-color, #3b496f);
      border-radius: 18px;
    }

    #remaining {
      margin-top: 10px;
      color: var(--header-color, #96e4d7);
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.2rem, 4vw, 4rem);
      font-weight: 760;
      line-height: 1;
    }

    #next {
      margin-top: 10px;
      color: #d2daf2;
      font-size: clamp(.8rem, 1.1vw, 1rem);
    }

    #scheduleLink {
      display: inline-block;
      margin-top: 12px;
      color: var(--header-color, #a8bdf7);
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    #schedulePanel {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: var(--panel-color, #1d2540);
      border: 1px solid var(--header-color, #3b496f);
      border-radius: 14px;
      text-align: left;
    }

    #schedulePanel.show { display: block; }

    #scheduleList {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #scheduleList li {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(168,189,247,.16);
      font-size: .9rem;
    }

    #scheduleList li:last-child { border-bottom: 0; }

    #scheduleList .alarm-time {
      color: var(--header-color, #96e4d7);
      white-space: nowrap;
      font-weight: 700;
    }

    #downloadStatus,
    #audioDebug {
      margin-top: 7px;
      color: #c0c9e4;
      font-size: .75rem;
    }

  
    /* Timer-like table styling */
    #dataTable {
      background: var(--panel-color, #1d2540);
      color: var(--text-color, #f7f8ff);
      border: 1px solid var(--header-color, #3b496f);
      border-radius: 18px;
      overflow: hidden;
      border-collapse: separate;
      border-spacing: 0;
      box-shadow: none;
    }

    #dataTable th,
    #dataTable td {
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.12);
      padding: 12px 14px;
      color: inherit;
    }

    #dataTable thead th,
    #dataTable thead td {
      background: var(--header-color, #3b496f) !important;
      color: var(--header-text-color, #f7f8ff);
      font-weight: 700;
    }

    #dataTable tbody td {
      background: var(--row-color, #1d2540) !important;
    }

    #dataTable tbody tr:last-child td {
      border-bottom: 0;
    }

  
    /* Equal top-panel sizing and requested text colors */
    #clockPanel {
      box-sizing: border-box;
    }

    #dataTable {
      box-sizing: border-box;
      table-layout: fixed;
    }

    #dataTable,
    #dataTable th,
    #dataTable td {
      color: #000 !important;
    }

    #clock {
      color: var(--time-color, #444444) !important;
    }

    #date {
      color: var(--header-dark-color, #CC8400) !important;
    }

  
    /* Compact timer footer: click the next-alarm line to reveal details */
    #next {
      margin-top: 8px;
      margin-bottom: 0;
      cursor: pointer;
      user-select: none;
      color: #000 !important;
    }

    #next:hover {
      text-decoration: underline;
    }

    #timerExtras {
      display: none;
      margin-top: 8px;
    }

    #timerExtras.show {
      display: block;
    }

    #schedulePanel {
      display: none;
    }

    #schedulePanel.show {
      display: block;
    }

    #countdownBox {
      padding-bottom: 12px;
    }

  
    #timerExtras,
    #timerExtras a,
    #downloadStatus,
    #audioDebug,
    #schedulePanel,
    #schedulePanel h3,
    #scheduleList,
    #scheduleList li,
    #scheduleList .alarm-time {
      color: #000 !important;
    }

  
    #dataTable thead th,
    #dataTable thead td {
      font-size: 1.25rem;
    }

  
    #dataTable th,
    #dataTable td {
      border: 1px solid var(--header-dark-color, #CC8400) !important;
    }

    #dataTable thead th,
    #dataTable thead td {
      text-align: center !important;
    }

  
    #dataTable th,
    #dataTable td {
      padding-top: 5px !important;
      padding-bottom: 5px !important;
      line-height: 1.15;
      vertical-align: middle;
    }

  
    #sheet2Text {
      color: #000 !important;
      font-size: clamp(1rem, 1.6vw, 1.5rem);
      line-height: 1.15;
      font-weight: 400;
      margin: 0 0 3px 0;
      white-space: pre-line;
    }

  
    #countdownBox {
      border: 1px solid var(--header-dark-color, #CC8400) !important;
    }

  </style>
</head>
<body>

<div id="clockPanel">
  <div id="sheet2Text"></div>
  <div id="clock">--:--</div>
  <div id="date"></div>

  <div id="countdownBox">
    <div class="clock-label">
      Time until <span id="alarmName">next alarm</span>
    </div>
    <span id="targetLabel" style="display:none;">--</span>
    <div id="remaining">--:--:--</div>
    <div id="next" role="button" tabindex="0" aria-expanded="false" aria-controls="timerExtras"></div>

    <div id="timerExtras">
      <a id="scheduleLink" href="#" aria-expanded="false" aria-controls="schedulePanel">Check Schedules</a>
      <div id="downloadStatus">Downloaded file: 0 records — Pending</div>
      <div id="audioDebug">AudioContext: not created</div>

      <div id="schedulePanel">
        <ul id="scheduleList"></ul>
      </div>
    </div>
  </div>
</div>


<table id="dataTable">
  <colgroup>
    <col style="width: 14%;">
    <col style="width: 43%;">
    <col style="width: 43%;">
  </colgroup>
  <thead></thead>
  <tbody></tbody>
</table>

<script>
document.addEventListener("DOMContentLoaded", function () {
  // Helper to convert <br>, <br/>, <br /> (any case) -> \n
  const normalize = s => (s || '').replace(/<br\s*\/?>/gi, '\n');

  // Get URL params (support the misspelling + correct spelling)
  const urlParams = new URLSearchParams(window.location.search);
  const classSeperator = (urlParams.get('Class_Seperator') || urlParams.get('Class_Separator') || '').trim();
  const hasFilter = !!classSeperator; // if false, we'll show ALL rows instead of returning
  const data_source      = urlParams.get('Data_Source');
  const backColor        = urlParams.get('Back_Color');
  const tableHeaderColor = urlParams.get('Table_Header');
  const tableRowColor    = urlParams.get('Table_Row');
  const timeColor        = urlParams.get('Time_Clr');

  // Share the same URL-driven colors with both the table and timer.
  const rootStyle = document.documentElement.style;

  if (backColor && /^#[0-9A-Fa-f]{6}$/.test(backColor)) {
    rootStyle.setProperty('--page-color', backColor);
  }

  if (tableHeaderColor && /^#[0-9A-Fa-f]{6}$/.test(tableHeaderColor)) {
    rootStyle.setProperty('--header-color', tableHeaderColor);

    // Make a version that is 20% darker for the clock time and date.
    const r = Math.round(parseInt(tableHeaderColor.slice(1, 3), 16) * 0.80);
    const g = Math.round(parseInt(tableHeaderColor.slice(3, 5), 16) * 0.80);
    const b = Math.round(parseInt(tableHeaderColor.slice(5, 7), 16) * 0.80);
    const darkerHeader =
      '#' +
      r.toString(16).padStart(2, '0') +
      g.toString(16).padStart(2, '0') +
      b.toString(16).padStart(2, '0');

    rootStyle.setProperty('--header-dark-color', darkerHeader);
  }

  if (tableRowColor && /^#[0-9A-Fa-f]{6}$/.test(tableRowColor)) {
    rootStyle.setProperty('--row-color', tableRowColor);
    rootStyle.setProperty('--panel-color', tableRowColor);
  }

  if (timeColor && /^#[0-9A-Fa-f]{6}$/.test(timeColor)) {
    rootStyle.setProperty('--time-color', timeColor);
  }

  // Theme
  if (backColor && /^#[0-9A-Fa-f]{6}$/.test(backColor)) {
    document.body.style.backgroundColor = backColor;
  }

  const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTpZrnrbqmMAZqqTFre3fgoZa73ZiYj7XhJzNXSHYhyXIVQb-WjCJfY2K25Rxm28U7JuCdXTbOOOLXy/pub?output=csv';
    
  const proxyUrl = ''; 
  const finalUrl = proxyUrl + sheetUrl;

  fetch(finalUrl)
    .then(response => response.text())
    .then(text => {
      // Normalize line endings and split
      const rows = text.replace(/\r/g, '').split('\n').filter(r => r.trim().length > 0);
      if (rows.length === 0) return;

      const tableBody = document.querySelector("#dataTable tbody");
      const tableHeader = document.querySelector("#dataTable thead");

      // Build header (skip columns 3 (index 2) and 9 (index 8))
      const headerCells = rows[0].split(',');
      let headerRow = tableHeader.insertRow();
      headerCells.forEach((cell, index) => {
        if (index !== 1 && index !== 2 && index !== 3 && index <= 5 && index !== 6 && index !== 8) {
          let newHeaderCell = headerRow.insertCell();
          let headerText = normalize(cell);
          if (/^Class\s+Seperator$/i.test(headerText) || /^Class\s+Separator$/i.test(headerText)) {
            headerText = "Class";
          }
          newHeaderCell.textContent = headerText; // normalize header too, just in case
          if (tableHeaderColor && /^#[0-9A-Fa-f]{6}$/.test(tableHeaderColor)) {
            newHeaderCell.style.backgroundColor = tableHeaderColor;
          }
        }
      });


      // Keep ONLY the most recent published row for each Class Separator
      const latestByClass = new Map();

      rows.slice(1).forEach(row => {
        const cells = row.split(',');

        if (cells.length > 1) {
          // Column C (index 2) must be "Yes"
          const publishYes = (cells[2] || "").trim().toLowerCase() === "yes";
          if (!publishYes) return;

          const classSeparator = (cells[0] || "").trim();
          const rowDate = new Date(cells[1]);

          if (!classSeparator || isNaN(rowDate.getTime())) return;

          const existing = latestByClass.get(classSeparator);

          // Store this row if it is the first for this class,
          // or if its date is newer than the currently stored row.
          if (!existing || rowDate > new Date(existing[1])) {
            latestByClass.set(classSeparator, cells);
          }
        }
      });

      // Convert the latest row from each class back into an array
      let tableRows = Array.from(latestByClass.values());

      // Sort the resulting class rows by date, newest first
      tableRows.sort((a, b) => new Date(b[1]) - new Date(a[1]));

      // Render body
      tableRows.forEach(cells => {
        let newRow = tableBody.insertRow();
        for (let i = 0; i < headerCells.length; i++) {
          if (i !== 1 && i !== 2 && i !== 3 && i <= 5) { // hide date and skip same columns as header
            let newCell = newRow.insertCell();
                if (i === 4 || i === 5) { 
                    newCell.style.width = '25%';
                }
                if (i === 7) { // column 8 (index 7) becomes a link using col 9 (index 8) for URL
                  if (cells[8] && cells[8].trim() !== '') 
                  {
                      const link = document.createElement('a');
                      link.href = cells[8] || '#';
                      link.target = '_blank';
                      link.rel = 'noopener noreferrer';
                      link.textContent = normalize(cells[7]);
                    if( cells[6]  !== '')
                    {
                      newCell.appendChild(document.createTextNode(normalize(cells[6])));
                      newCell.appendChild(document.createElement('br'));
                      newCell.appendChild(document.createElement('br'));
                    }
                    newCell.appendChild(link);
                  } 
                  else {
                  if (i === 3) {
                    newCell.classList.add('bold-col')
                  }
                  // Just plain text if no URL
                  newCell.textContent = normalize(cells[7]);
                  }
                }  
                else {
              newCell.textContent = normalize(cells[i]);
            }
            if (tableRowColor && /^#[0-9A-Fa-f]{6}$/.test(tableRowColor)) {
              newCell.style.backgroundColor = tableRowColor;
            }
          }
        }

      });
    })
    .catch(error => {
      console.error("Error fetching the Google Sheet data:", error);
    });
});
</script>


<script>
(() => {
  const sheet2Text = document.getElementById('sheet2Text');
  const clock = document.getElementById('clock');
  const date = document.getElementById('date');
  const remaining = document.getElementById('remaining');
  const next = document.getElementById('next');
  const timerExtras = document.getElementById('timerExtras');
  const targetLabel = document.getElementById('targetLabel');
  const alarmName = document.getElementById('alarmName');
  const scheduleLink = document.getElementById('scheduleLink');
  const schedulePanel = document.getElementById('schedulePanel');
  const scheduleList = document.getElementById('scheduleList');
  const downloadStatus = document.getElementById('downloadStatus');
  const audioDebug = document.getElementById('audioDebug');

  const pad = n => String(n).padStart(2, '0');

  let audioContext;
  let schedule = [];
  let nextTarget = null;
  let previousTick = new Date();
  const triggeredAlarms = new Set();

  function parseCSV(text) {
    const rows = [];
    let row = [];
    let cell = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];

      if (inQuotes) {
        if (ch === '"' && text[i + 1] === '"') {
          cell += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = false;
        } else {
          cell += ch;
        }
      } else if (ch === '"') {
        inQuotes = true;
      } else if (ch === ',') {
        row.push(cell);
        cell = '';
      } else if (ch === '\n') {
        row.push(cell.replace(/\r$/, ''));
        rows.push(row);
        row = [];
        cell = '';
      } else {
        cell += ch;
      }
    }

    row.push(cell.replace(/\r$/, ''));
    if (row.some(v => v.trim() !== '')) rows.push(row);
    return rows;
  }

  function parseTimeCell(value) {
    const text = String(value ?? '').trim();
    if (!text) return null;

    let m = text.match(/\b(1[0-2]|0?[1-9])(?::([0-5]\d))?(?::[0-5]\d)?\s*([AP])\.?\s*M\.?\b/i);
    if (m) {
      let hour = Number(m[1]) % 12;
      if (m[3].toUpperCase() === 'P') hour += 12;
      return hour * 60 + Number(m[2] || 0);
    }

    m = text.match(/(?:^|[\sT])([01]?\d|2[0-3]):([0-5]\d)(?::[0-5]\d)?(?:$|\s)/);
    if (m) return Number(m[1]) * 60 + Number(m[2]);

    return null;
  }

  function formatMinutes(totalMinutes) {
    const d = new Date();
    d.setHours(Math.floor(totalMinutes / 60), totalMinutes % 60, 0, 0);
    return new Intl.DateTimeFormat(undefined, {
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    }).format(d);
  }

  function renderScheduleList() {
    scheduleList.innerHTML = '';

    for (const item of schedule) {
      const li = document.createElement('li');

      const name = document.createElement('span');
      name.textContent = item.name;

      const time = document.createElement('span');
      time.className = 'alarm-time';
      time.textContent = formatMinutes(item.minutes);

      li.appendChild(name);
      li.appendChild(time);
      scheduleList.appendChild(li);
    }
  }

  function chooseNextAlarm(now = new Date()) {
    if (!schedule.length) {
      nextTarget = null;
      return;
    }

    const current = now.getHours() * 60 + now.getMinutes();
    const afterStartOfMinute = now.getSeconds() > 0 || now.getMilliseconds() > 0;

    let chosen = schedule.find(item =>
      item.minutes > current ||
      (item.minutes === current && !afterStartOfMinute)
    );

    const target = new Date(now);

    if (!chosen) {
      chosen = schedule[0];
      target.setDate(target.getDate() + 1);
    }

    target.setHours(
      Math.floor(chosen.minutes / 60),
      chosen.minutes % 60,
      0,
      0
    );

    nextTarget = {
      date: target,
      name: chosen.name,
      minutes: chosen.minutes
    };
  }


  async function loadSheet2Text() {
    // This uses the same published Google Sheet, but requests Sheet2 by name.
    // A second candidate is included in case the tab is named "Sheet 2".
    const sheet2Urls = [
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vScGM09OgFDEAfWST9DrmgMP7ivgxrKFxf3uEKLg9YFWCXtzUxn2R53LswilC82cm2ECNmCrzWihuBY/pub?output=csv&gid=796863577&_=' + Date.now()
    ];

    for (const url of sheet2Urls) {
      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) continue;

        const csvText = await response.text();
        if (!csvText.trim()) continue;

        const rows = parseCSV(csvText);

        // Combine all non-empty cells on Sheet 2 into readable text.
        const displayLines = rows
          .map(row => row.map(cell => String(cell ?? '').trim())
                         .filter(Boolean)
                         .join(' '))
          .filter(Boolean);

        if (displayLines.length) {
          sheet2Text.textContent = displayLines.join('\n');
          return true;
        }
      } catch (err) {
        console.warn('Sheet 2 text download failed for URL:', url, err);
      }
    }

    sheet2Text.textContent = '';
    return false;
  }

  async function loadSchedule() {
    try {
      const response = await fetch(
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vScGM09OgFDEAfWST9DrmgMP7ivgxrKFxf3uEKLg9YFWCXtzUxn2R53LswilC82cm2ECNmCrzWihuBY/pub?output=csv&_=' + Date.now(),
        { cache: 'no-store' }
      );

      if (!response.ok) {
        throw new Error(`schedule.csv returned HTTP ${response.status} ${response.statusText}`);
      }

      const text = await response.text();
      if (!text.trim()) throw new Error('schedule.csv is empty');

      const rows = parseCSV(text);
      const alarms = [];

      for (const row of rows) {
        if (row.length < 2) continue;

        const name = String(row[0] ?? '').trim();
        const timeText = String(row[1] ?? '').trim();
        const minutes = parseTimeCell(timeText);

        if (minutes !== null) {
          alarms.push({
            name: name || 'Alarm',
            minutes
          });
        }
      }

      schedule = alarms.sort((a, b) => a.minutes - b.minutes);

      if (!schedule.length) {
        throw new Error('CSV loaded, but no valid alarm times were found in column B');
      }

      downloadStatus.textContent =
        `Downloaded file: ${schedule.length} records — Success`;

      chooseNextAlarm();
      renderScheduleList();
      update();
    } catch (err) {
      console.error('Schedule download failed:', err);

      schedule = [];
      nextTarget = null;

      alarmName.textContent = 'no alarm loaded';
      targetLabel.textContent = '--';
      remaining.textContent = '--:--:--';
      next.textContent = '';
      scheduleList.innerHTML = '';

      downloadStatus.textContent =
        'Downloaded file: 0 records — Failure — ' +
        (err?.message || String(err));
    }
  }

  function updateAudioDebug() {
    if (!audioContext) {
      audioDebug.textContent = 'AudioContext: not created';
    } else {
      audioDebug.textContent = 'AudioContext: ' + audioContext.state;
    }
  }

  async function enableAudioFromInteraction() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;

    if (!audioContext) audioContext = new AudioContextClass();

    try {
      await audioContext.resume();
    } catch (_) {}

    updateAudioDebug();
  }

  ['click', 'pointerdown', 'touchstart', 'keydown'].forEach(eventName => {
    document.addEventListener(eventName, enableAudioFromInteraction, {
      passive: eventName !== 'keydown'
    });
  });

  function playAlarm() {
    updateAudioDebug();

    if (!audioContext || audioContext.state !== 'running') {
      console.warn('Alarm time reached, but the browser has not allowed audio yet.');
      return;
    }

    for (let i = 0; i < 40; i++) {
      const oscillator = audioContext.createOscillator();
      const volume = audioContext.createGain();
      const start = audioContext.currentTime + i * .5;

      oscillator.type = 'sine';
      oscillator.frequency.value = i % 2 ? 660 : 880;

      volume.gain.setValueAtTime(.0001, start);
      volume.gain.exponentialRampToValueAtTime(.23, start + .025);
      volume.gain.exponentialRampToValueAtTime(.0001, start + .45);

      oscillator.connect(volume).connect(audioContext.destination);
      oscillator.start(start);
      oscillator.stop(start + .5);
    }
  }

  function alarmKeyFor(dateObj, item) {
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth() + 1).padStart(2, '0');
    const d = String(dateObj.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}-${item.minutes}-${item.name}`;
  }

  function checkScheduledAlarms(previous, now) {
    if (!schedule.length) return;

    const startDay = new Date(previous);
    startDay.setHours(0, 0, 0, 0);

    const endDay = new Date(now);
    endDay.setHours(0, 0, 0, 0);

    for (
      let day = new Date(startDay);
      day <= endDay;
      day.setDate(day.getDate() + 1)
    ) {
      for (const item of schedule) {
        const target = new Date(day);

        target.setHours(
          Math.floor(item.minutes / 60),
          item.minutes % 60,
          0,
          0
        );

        if (previous < target && now >= target) {
          const key = alarmKeyFor(target, item);

          if (!triggeredAlarms.has(key)) {
            triggeredAlarms.add(key);
            playAlarm();
          }
        }
      }
    }
  }

  function update() {
    const now = new Date();

    clock.textContent = new Intl.DateTimeFormat(undefined, {
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    }).format(now);

    date.textContent = new Intl.DateTimeFormat(undefined, {
      weekday: 'long',
      month: 'long',
      day: 'numeric',
      year: 'numeric'
    }).format(now);

    if (!nextTarget && schedule.length) chooseNextAlarm(now);

    checkScheduledAlarms(previousTick, now);

    if (nextTarget && now >= nextTarget.date) {
      chooseNextAlarm(new Date(nextTarget.date.getTime() + 1000));
    }

    if (nextTarget) {
      const timeText = new Intl.DateTimeFormat(undefined, {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      }).format(nextTarget.date);

      alarmName.textContent = nextTarget.name;
      targetLabel.textContent = timeText;

      const seconds = Math.max(0, Math.ceil((nextTarget.date - now) / 1000));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);

      remaining.textContent =
        `${pad(hours)}:${pad(minutes)}:${pad(seconds % 60)}`;

      const sameDay =
        nextTarget.date.getFullYear() === now.getFullYear() &&
        nextTarget.date.getMonth() === now.getMonth() &&
        nextTarget.date.getDate() === now.getDate();

      next.textContent =
        `Next scheduled alarm: ${nextTarget.name} — ${sameDay ? 'today' : 'tomorrow'} at ${timeText}`;
    }

    previousTick = now;
  }


  function toggleTimerExtras() {
    const isOpen = timerExtras.classList.toggle('show');
    next.setAttribute('aria-expanded', String(isOpen));
  }

  next.addEventListener('click', toggleTimerExtras);

  next.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggleTimerExtras();
    }
  });

  scheduleLink.addEventListener('click', event => {
    event.preventDefault();
    const isOpen = schedulePanel.classList.toggle('show');
    scheduleLink.setAttribute('aria-expanded', String(isOpen));
  });

  updateAudioDebug();
  loadSheet2Text();
  loadSchedule();
  setInterval(() => {
    loadSheet2Text();
    loadSchedule();
  }, 5 * 60 * 1000);
  update();
  setInterval(update, 250);
})();
</script>

</body>
</html>
